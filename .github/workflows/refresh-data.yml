name: Refresh Packers Central

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-data.mjs'
      - 'scripts/update-football.mjs'
      - 'scripts/update-opponent.mjs'
      - 'scripts/smoke-test.mjs'
      - 'app.js'
      - 'scout.js'
      - '.github/workflows/refresh-data.yml'
  schedule:
    - cron: '9,24,39,54 * * * *'
    - cron: '18 */3 * * *'

permissions:
  contents: write

concurrency:
  group: packers-central-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check scout.js
          node --check scripts/smoke-test.mjs
          node --check scripts/update-football.mjs
          node --check scripts/update-opponent.mjs
          node --check scripts/fetch-data.mjs
      - name: Update scores and standings
        run: node scripts/update-football.mjs
      - name: Update next opponent scouting report
        run: node scripts/update-opponent.mjs
      - name: Update news headlines
        if: github.event_name != 'schedule' || github.event.schedule == '18 */3 * * *'
        run: node scripts/fetch-data.mjs
      - name: Smoke-test site scores and scouting
        run: node scripts/smoke-test.mjs
      - name: Commit any refreshed feeds
        run: |
          if git diff --quiet -- data/news.json data/schedule.json data/season.json data/opponent.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/schedule.json data/season.json data/opponent.json
          git commit -m "Refresh Packers news and results"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Remote moved; trying to integrate changes (attempt $attempt)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep 2
          done
          exit 1